<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAILMET - Rail In-Motion Weighing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/railmet.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
<main class="rm-content" hidden>
    <div style="width:100%;display:flex;flex-direction:column;flex:1;min-height:0;">
        <div class="rm-panel" style="margin-bottom:12px;">
            <div class="rm-panel-header"><span class="rm-panel-title">Filters</span></div>
            <div class="rm-panel-body" style="padding:16px 20px;">
                <div style="margin-bottom:16px;">
                    <label class="rm-filter-label" style="margin-bottom:6px;" for="selRake">SELECT RAKE</label>
                    <select class="rm-filter-select" id="selRake" style="width:280px;max-width:100%;height:36px;font-size:13px;padding:6px 10px;"></select>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                    <div style="display:flex;gap:8px;">
                        <button class="rm-btn rm-btn-blue" id="btnGenerate"><i class="bi bi-search"></i> Generate</button>
                        <button class="rm-btn rm-btn-blue" id="btnRefresh"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                    </div>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <span class="rm-locked-note" id="pdfLocked" hidden><i class="bi bi-lock"></i> PDF export requires <code>reports.export</code></span>
                        <button class="rm-btn rm-btn-gray" id="btnPdf" disabled><i class="bi bi-file-earmark-pdf"></i> PDF</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="rm-panel" style="flex:1;min-height:0;display:flex;flex-direction:column;">
            <div style="flex:1;min-height:0;overflow-x:auto;overflow-y:auto;">
                <table class="rm-wagon-table" style="width:100%;min-width:max-content;">
                    <thead><tr>
                        <th>Wagon No</th><th>Weight (T)</th><th>Speed</th><th>Front Bogie</th><th>Rear Bogie</th>
                        <th>LH1</th><th>RH1</th><th>LH2</th><th>RH2</th><th>LH3</th><th>RH3</th><th>LH4</th><th>RH4</th>
                    </tr></thead>
                    <tbody id="repBody">
                        <tr><td colspan="13" style="text-align:center;color:#A0AEC0;padding:32px;">Click Generate to view report.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script>
(function () {
    if (!RM.boot({ page: 'reports', perm: 'reports.view' })) return;
    const $ = id => document.getElementById(id);
    const f2 = RM.t2;
    const canExport = RM.can('reports.export');
    let current = null;

    function loadRakes() {
        const prev = $('selRake').value;
        const rakes = RMData.all().slice().sort((a, b) => a.rakeNo.localeCompare(b.rakeNo));
        $('selRake').innerHTML = '<option value="">Choose a rake</option>' +
            rakes.map(r => '<option value="' + RM.esc(r.rakeNo) + '">' + RM.esc(r.rakeNo) + '</option>').join('');
        $('selRake').value = rakes.some(r => r.rakeNo === prev) ? prev : '';
    }

    function setPdf(enabled) {
        const on = enabled && canExport;
        $('btnPdf').disabled = !on;
        $('pdfLocked').hidden = canExport || !enabled;
    }

    function rows(rake) {
        return rake.wagons.map((w, i) => {
            const c = RMData.calc(w);
            return { no: i + 1, weight: c.gross, speed: w.speed, front: c.front, rear: c.rear, lh: w.lh, rh: w.rh };
        });
    }

    function generate() {
        const no = $('selRake').value;
        if (!no) { RM.toast('Please select a rake.', 'error'); return; }
        current = RMData.get(no);
        if (!current) return;
        $('repBody').innerHTML = rows(current).map(r =>
            '<tr><td>' + r.no + '</td><td class="col-gross">' + f2(r.weight) + '</td><td>' + r.speed.toFixed(1) + '</td>' +
            '<td>' + f2(r.front) + '</td><td>' + f2(r.rear) + '</td>' +
            [0, 1, 2, 3].map(a => '<td>' + f2(r.lh[a]) + '</td><td>' + f2(r.rh[a]) + '</td>').join('') + '</tr>').join('');
        setPdf(true);
    }

    /* Same layout as the original "WagonDetails Report" printable page */
    function pdf() {
        if (!current || !canExport) return;
        const pad = RM.pad;
        const d = iso => { const x = new Date(iso); return pad(x.getDate()) + '-' + pad(x.getMonth() + 1) + '-' + x.getFullYear(); };
        const t = iso => { const x = new Date(iso); return pad(x.getHours()) + ':' + pad(x.getMinutes()) + ':' + pad(x.getSeconds()); };
        const now = new Date();
        const rs = rows(current);
        const sum = k => rs.reduce((s, r) => s + r[k], 0);
        const sumA = (k, a) => rs.reduce((s, r) => s + r[k][a], 0);
        const e = RM.esc;
        const html = '<!DOCTYPE html><html><head><meta charset="utf-8" /><title>WagonDetails Report</title><style>' +
            '*{margin:0;padding:0;box-sizing:border-box;}@page{size:A4 landscape;margin:12mm 14mm;}' +
            'body{font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;background:#fff;font-size:11px;line-height:1.4;}' +
            '.report{width:100%;margin:0 auto;}.header{text-align:center;margin-bottom:18px;}' +
            '.header h1{font-size:26px;font-weight:700;color:#111;letter-spacing:.5px;margin-bottom:2px;}.header h2{font-size:15px;font-weight:600;color:#222;}' +
            '.header h3{font-size:14px;font-weight:600;color:#333;}.header h4{font-size:13px;font-weight:500;color:#444;}' +
            '.info-table{width:100%;border-collapse:collapse;margin-bottom:18px;}.info-table td{border:1px solid #888;padding:6px 10px;font-size:12px;}' +
            '.info-table .label{background:#f0f0f0;font-weight:700;text-align:right;width:14%;}.info-table .value{width:36%;text-align:left;padding-left:12px;}' +
            '.section-title{font-size:20px;font-weight:700;margin:16px 0 10px 0;}' +
            '.wagon-table{width:100%;border-collapse:collapse;font-size:10.5px;}' +
            '.wagon-table th{background:#1a56db;color:#fff;padding:6px 5px;text-align:center;border:1px solid #ccc;font-weight:700;font-size:10px;white-space:nowrap;}' +
            '.wagon-table td{padding:5px 4px;border:1px solid #ccc;text-align:center;white-space:nowrap;}.wagon-table tr:nth-child(even){background:#f7f8fa;}' +
            '.footer{text-align:right;margin-top:16px;font-size:11px;color:#555;}' +
            '@media print{.wagon-table tr{page-break-inside:avoid;}}</style></head><body><div class="report">' +
            '<div class="header"><h1>WagonDetails Report</h1><h2>Automatic Asymmetric Load measurement system</h2><h3>South Western Railway</h3><h4>RAKE REPORT</h4></div>' +
            '<table class="info-table">' +
            '<tr><td class="label">Rake NO</td><td class="value">' + e(current.rakeNo) + '</td><td class="label">Source</td><td class="value">' + e(current.source) + '</td></tr>' +
            '<tr><td class="label">Rake IN DATE</td><td class="value">' + d(current.inAt) + '</td><td class="label">Rake OUT DATE</td><td class="value">' + d(current.outAt) + '</td></tr>' +
            '<tr><td class="label">Destination</td><td class="value">' + e(current.destination) + '</td><td class="label">Rake IN Time</td><td class="value">' + t(current.inAt) + '</td></tr>' +
            '<tr><td class="label">Rake OUT Time</td><td class="value">' + t(current.outAt) + '</td><td class="label">Direction</td><td class="value">' + e(current.direction) + '</td></tr>' +
            '</table><div class="section-title">Weighment Report</div><table class="wagon-table"><thead><tr>' +
            ['Wagon No', 'Weight (T)', 'Speed', 'Front Bogie', 'Rear Bogie', 'LH1', 'RH1', 'LH2', 'RH2', 'LH3', 'RH3', 'LH4', 'RH4'].map(h => '<th>' + h + '</th>').join('') +
            '</tr></thead><tbody>' +
            rs.map(r => '<tr><td>' + r.no + '</td><td>' + f2(r.weight) + '</td><td>' + r.speed.toFixed(1) + '</td><td>' + f2(r.front) + '</td><td>' + f2(r.rear) + '</td>' +
                [0, 1, 2, 3].map(a => '<td>' + f2(r.lh[a]) + '</td><td>' + f2(r.rh[a]) + '</td>').join('') + '</tr>').join('') +
            '<tr style="background:#e2e8f0;font-weight:700;"><td>TOTAL</td><td>' + sum('weight').toFixed(2) + '</td><td></td><td>' + sum('front').toFixed(2) + '</td><td>' + sum('rear').toFixed(2) + '</td>' +
            [0, 1, 2, 3].map(a => '<td>' + sumA('lh', a).toFixed(2) + '</td><td>' + sumA('rh', a).toFixed(2) + '</td>').join('') + '</tr>' +
            '</tbody></table><div class="footer">Generated on: ' + pad(now.getDate()) + '-' + pad(now.getMonth() + 1) + '-' + now.getFullYear() + ' ' +
            pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()) + '</div></div></body></html>';

        const win = window.open('', '_blank');
        if (!win) { alert('Popup blocked. Please allow popups for this site and try again.'); return; }
        win.document.write(html); win.document.close(); win.focus();
        setTimeout(() => win.print(), 300);
    }

    $('btnGenerate').onclick = generate;
    $('btnRefresh').onclick = () => { loadRakes(); RM.toast('Rake list refreshed.'); };
    $('btnPdf').onclick = pdf;
    $('selRake').onchange = () => setPdf(false);
    loadRakes();
})();
</script>
</body>
</html>
