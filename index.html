<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAILMET - Rail In-Motion Weighing System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/railmet.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
<div class="rml-page">
    <div class="rml-brand">
        <span class="rml-brand-title">RAILMET</span>
        <span class="rml-brand-sub">SPEEDMATTERS</span>
    </div>

    <div class="rml-body">
        <div class="rml-card">
            <div class="rml-card-head">
                <div class="rml-card-kicker">Wagon Weighing Monitor</div>
                <h1 class="rml-card-title">Sign In</h1>
                <p class="rml-card-subtitle">Authorized personnel only</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="rml-error" role="alert" id="loginError" hidden>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    <span id="loginErrorText"></span>
                </div>

                <div class="rml-field">
                    <label class="rml-label" for="loginUsername">Username</label>
                    <div class="rml-input-wrap">
                        <svg class="rml-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-3.9 3.6-6.5 8-6.5s8 2.6 8 6.5"></path></svg>
                        <input id="loginUsername" class="rml-input" placeholder="Enter username" autocomplete="username">
                    </div>
                </div>

                <div class="rml-field">
                    <label class="rml-label" for="loginPassword">Password</label>
                    <div class="rml-input-wrap">
                        <svg class="rml-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
                        <input id="loginPassword" type="password" class="rml-input" placeholder="Enter password" autocomplete="current-password">
                    </div>
                </div>

                <div class="rml-row">
                    <label class="rml-check"><input type="checkbox" id="loginRemember"> Remember me</label>
                    <button type="button" class="rml-forgot" id="btnForgot">Forgot password?</button>
                </div>
                <div class="rml-info" role="status" id="loginInfo" hidden>Contact the system administrator to reset your password.</div>

                <div class="rml-track" aria-hidden="true">
                    <div class="rml-rail"></div>
                    <span class="rml-signal" id="signal"></span>
                    <div class="rml-wagon" id="wagonTrain">
                        <svg width="136" height="24" viewBox="0 0 136 24" fill="none">
                            <line x1="23" y1="13" x2="29" y2="13" stroke="#8A97AB" stroke-width="2.5"/><rect x="1" y="4" width="22" height="12" rx="2" fill="#0A1830"/><rect x="1" y="4" width="22" height="3.5" rx="1" fill="#1E5FD9"/><circle cx="9" cy="19" r="3.4" fill="#8A97AB"/><circle cx="18" cy="19" r="3.4" fill="#8A97AB"/>
                            <line x1="51" y1="13" x2="57" y2="13" stroke="#8A97AB" stroke-width="2.5"/><rect x="29" y="4" width="22" height="12" rx="2" fill="#0A1830"/><rect x="29" y="4" width="22" height="3.5" rx="1" fill="#F0A73B"/><circle cx="37" cy="19" r="3.4" fill="#8A97AB"/><circle cx="46" cy="19" r="3.4" fill="#8A97AB"/>
                            <line x1="79" y1="13" x2="85" y2="13" stroke="#8A97AB" stroke-width="2.5"/><rect x="57" y="4" width="22" height="12" rx="2" fill="#0A1830"/><rect x="57" y="4" width="22" height="3.5" rx="1" fill="#1E5FD9"/><circle cx="65" cy="19" r="3.4" fill="#8A97AB"/><circle cx="74" cy="19" r="3.4" fill="#8A97AB"/>
                            <line x1="107" y1="13" x2="113" y2="13" stroke="#8A97AB" stroke-width="2.5"/><rect x="85" y="4" width="22" height="12" rx="2" fill="#0A1830"/><rect x="85" y="4" width="22" height="3.5" rx="1" fill="#F0A73B"/><circle cx="93" cy="19" r="3.4" fill="#8A97AB"/><circle cx="102" cy="19" r="3.4" fill="#8A97AB"/>
                            <rect x="113" y="4" width="22" height="12" rx="2" fill="#0A1830"/><rect x="113" y="4" width="22" height="3.5" rx="1" fill="#1E5FD9"/><circle cx="121" cy="19" r="3.4" fill="#8A97AB"/><circle cx="130" cy="19" r="3.4" fill="#8A97AB"/>
                        </svg>
                    </div>
                </div>

                <button type="submit" class="rml-btn" id="btnLogin"><span>Login</span></button>
            </form>
        </div>
    </div>

    <div class="rml-footer">
        <span>WAGON WEIGHING MONITOR — V1.0</span>
        <span>RS232 · 4G LINK</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/core.js"></script>
<script>
(function () {
    RM.init();
    // already signed in → go straight to the first permitted page
    const existing = RM.currentUser();
    if (existing && RM.homeFor(existing)) { location.replace(RM.homeFor(existing)); return; }

    const $ = id => document.getElementById(id);
    const form = $('loginForm'), err = $('loginError'), errText = $('loginErrorText');
    const showError = msg => { errText.textContent = msg; err.hidden = false; };

    $('btnForgot').onclick = () => { $('loginInfo').hidden = false; };

    form.addEventListener('submit', e => {
        e.preventDefault();
        err.hidden = true;
        const u = $('loginUsername').value.trim(), p = $('loginPassword').value;
        if (!u || !p) return showError('Please enter both username and password.');

        const res = RM.login(u, p, $('loginRemember').checked);
        if (!res.ok) { $('loginPassword').value = ''; return showError(res.error); }

        const home = RM.homeFor(res.user);
        if (!home) { RM.clearSession(); return showError('Your role has no modules assigned. Contact the system administrator.'); }

        // signal arms, wagon crosses the rail, then navigate
        $('btnLogin').disabled = true;
        $('btnLogin').innerHTML = '<span>Signing in…</span>';
        $('signal').classList.add('armed');
        $('wagonTrain').classList.add('run');
        setTimeout(() => location.href = home, 1250);
    });
})();
</script>
</body>
</html>
