<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAILMET - Rail In-Motion Weighing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/railmet.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
<main class="rm-content" hidden style="overflow:auto;">
    <div class="rm-page-head">
        <h5><i class="bi bi-gear"></i>Settings</h5>
    </div>
    <div class="rm-settings-grid" style="display:grid;grid-template-columns:200px 1fr;gap:12px;">
        <div>
            <div class="rm-panel">
                <div class="rm-panel-body" style="padding:0;">
                    <div class="rm-tab-pills">
                        <button class="nav-link active" type="button"><i class="bi bi-broadcast"></i>MQTT</button>
                    </div>
                </div>
            </div>
        </div>
        <div>
            <div class="rm-panel">
                <div class="rm-panel-header"><span class="rm-panel-title">MQTT Diagnostics</span></div>
                <div class="rm-panel-body">
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;">
                        <div>
                            <label class="rm-form-label">Broker Status</label>
                            <div style="font-size:14px;font-weight:600;color:#16A34A;">Connected</div>
                            <div style="font-size:10px;color:#718096;margin-top:2px;">OK</div>
                        </div>
                        <div>
                            <label class="rm-form-label">Broker Host</label>
                            <div style="font-size:13px;color:#1a1a2e;" id="dHost"></div>
                        </div>
                        <div>
                            <label class="rm-form-label">Parsed</label>
                            <div style="font-size:13px;color:#1a1a2e;" id="dParsed"></div>
                        </div>
                    </div>
                    <div style="margin-bottom:14px;">
                        <label class="rm-form-label">Last Incoming Message</label>
                        <div style="background:#F7FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:10px;font-family:monospace;font-size:12px;color:#1a1a2e;word-break:break-all;" id="dLast"></div>
                    </div>
                    <div>
                        <label class="rm-form-label">Last HEX Payload</label>
                        <div style="background:#F7FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:10px;font-family:monospace;font-size:11px;color:#805AD5;word-break:break-all;" id="dHex"></div>
                    </div>
                </div>
            </div>

            <div class="rm-panel" style="margin-top:12px;">
                <div class="rm-panel-header"><span class="rm-panel-title">MQTT Raw Data Log</span></div>
                <div class="rm-panel-body">
                    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                        <div style="font-size:13px;font-weight:600;" id="logState"></div>
                        <button class="rm-btn rm-btn-blue" id="btnLog"><i class="bi bi-folder2-open"></i> Log</button>
                        <button class="rm-btn rm-btn-outline rm-btn-sm" id="btnDownloadLog"><i class="bi bi-download"></i> Download log (<span id="logCount">0</span>)</button>
                    </div>
                </div>
            </div>

            <div style="margin-top:12px;display:flex;align-items:center;gap:12px;">
                <button class="rm-btn rm-btn-blue" id="btnSave"><i class="bi bi-check-lg"></i> Save Settings</button>
                <span class="rm-locked-note" id="lockedNote" hidden><i class="bi bi-lock"></i> Read-only: requires <code>settings.edit</code></span>
            </div>
        </div>
    </div>
</main>
<style>@media (max-width: 767.98px) { .rm-settings-grid { grid-template-columns: 1fr !important; } }</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script>
(function () {
    if (!RM.boot({ page: 'settings', perm: 'settings.view' })) return;
    const $ = id => document.getElementById(id);
    const canEdit = RM.can('settings.edit');
    let logging = RMData.settings().logging;   // pending value until "Save Settings"

    function renderLog() {
        $('logState').textContent = 'Logging: ' + (logging ? 'ON' : 'OFF');
        $('logState').style.color = logging ? '#16A34A' : '#94A3B8';
        $('logCount').textContent = JSON.parse(localStorage.getItem('rm_mqtt_log') || '[]').length;
    }
    function renderDiag(d) {
        $('dHost').textContent = RMData.settings().brokerHost;
        $('dParsed').textContent = d.count + ' / ' + d.count;
        $('dLast').textContent = RMData.trunc(d.last, 90);
        $('dHex').textContent = RMData.trunc(d.hex, 240);
        renderLog();
    }

    $('btnLog').onclick = () => { logging = !logging; renderLog(); };
    $('btnSave').onclick = () => { RMData.saveSettings({ logging }); RM.toast('Settings saved.'); };
    $('btnDownloadLog').onclick = () => {
        const log = JSON.parse(localStorage.getItem('rm_mqtt_log') || '[]');
        if (!log.length) return RM.toast('Log is empty. Turn logging on and save.', 'error');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([log.join('\n')], { type: 'text/plain' }));
        a.download = 'mqtt_raw_log.txt'; a.click(); URL.revokeObjectURL(a.href);
    };
    if (!canEdit) { $('btnLog').disabled = $('btnSave').disabled = true; $('lockedNote').hidden = false; }

    renderDiag(RMData.mqttDiag());
    setInterval(() => renderDiag(RMData.mqttTick('beat')), 2000);
})();
</script>
</body>
</html>
